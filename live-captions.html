<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英語即時字幕</title>
<style>:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#f4f5f7;--muted:#8b93a3;--interim:#9aa3b2;--accent:#4f8cff;--danger:#e5484d;--ok:#35c46a;--warn:#f0b429;--cap-size:34px}@media (prefers-color-scheme:light){:root{--bg:#ffffff;--panel:#f3f4f6;--line:#d9dce3;--text:#111318;--muted:#5b6270;--interim:#6b7280}}@media (max-width:600px){:root{--cap-size:28px}}*{box-sizing:border-box}[hidden]{display:none !important}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}header{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px - (0px - env(safe-area-inset-top)));background:var(--panel);border-bottom:1px solid var(--line)}header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}.status{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);min-width:0;flex:1}#statusText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.dot.listening{background:var(--ok)}.dot.connecting{background:var(--warn)}.dot.error{background:var(--danger)}.meter{width:48px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}.meter i{display:block;height:100%;width:0;background:var(--ok)}.version{font-size:12px;color:var(--muted);flex:none}main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}.notice{position:sticky;top:0;z-index:1;display:flex;gap:8px;align-items:flex-start;max-width:1100px;margin:0 auto 12px;padding:10px 12px;border-radius:10px;border:1px solid var(--warn);background:var(--panel);font-size:15px;line-height:1.4}.notice span{flex:1}.notice button{min-height:32px;padding:4px 10px}#captions{font-size:var(--cap-size);line-height:1.35;max-width:1100px;margin:0 auto;overflow-wrap:anywhere}#captions p{margin:0 0 0.35em}#captions #interim{color:var(--interim)}#captions p.pending{color:var(--interim)}.empty{color:var(--muted);font-size:18px;text-align:center;margin-top:18vh;padding:0 8px}footer{display:flex;gap:8px;align-items:center;padding:10px 16px;padding-bottom:calc(10px - (0px - env(safe-area-inset-bottom)));background:var(--panel);border-top:1px solid var(--line)}button{font:inherit;font-size:16px;min-height:44px;padding:8px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button:disabled{opacity:0.45;cursor:default}#jumpBtn{position:fixed;right:16px;bottom:calc(78px - (0px - env(safe-area-inset-bottom)));z-index:2;background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,0.35)}#startBtn{flex:1;min-width:96px;max-width:260px;white-space:nowrap}#startBtn.stop{background:var(--danger);border-color:var(--danger)}.spacer{flex:1}dialog{width:min(520px,calc(100vw - 32px));border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,0.55)}dialog h2{margin:0 0 14px;font-size:18px}dialog label{display:block;font-size:15px;margin-bottom:14px}dialog select,dialog input{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}dialog a{color:var(--accent);margin-left:8px;font-size:14px}.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px}.msg{font-size:14px;color:var(--danger);margin:0 0 12px}@media (max-width:420px){header h1{display:none}.version{display:none}footer .spacer{display:none}footer button:not(#startBtn){padding:8px 10px}}</style>
</head>
<body>
<header>
  <h1>英語即時字幕</h1>
  <div class="status" role="status" aria-live="polite"><span id="statusDot" class="dot" aria-hidden="true"></span><span id="statusText">尚未開始</span></div>
  <div class="meter" title="麥克風音量"><i id="meterBar"></i></div>
  <span class="version">v1.2.1</span>
</header>

<main id="main">
  <div id="notice" class="notice" hidden><span id="noticeText"></span><button type="button" id="noticeClose">關閉</button></div>
  <div id="empty" class="empty">按「開始」後，講者說的英語會即時顯示在這裡。</div>
  <div id="captions" lang="en" aria-live="polite"><p id="interim"></p></div>
</main>
<button type="button" id="jumpBtn" hidden>↓ 最新</button>

<footer>
  <button type="button" id="startBtn" class="primary">開始</button>
  <span class="spacer"></span>
  <button type="button" id="smallerBtn" aria-label="字變小">A−</button>
  <button type="button" id="biggerBtn" aria-label="字變大">A+</button>
  <button type="button" id="clearBtn">清除</button>
  <button type="button" id="settingsBtn">設定</button>
</footer>

<dialog id="settings">
  <h2>設定</h2>
  <p id="settingsMsg" class="msg" hidden></p>
  <label>辨識引擎
    <select id="engineSelect">
      <option value="gemini">Gemini（準確，需要金鑰）</option>
      <option value="browser">瀏覽器內建（免費，準確度較低）</option>
    </select>
  </label>
  <label>Gemini API 金鑰
    <a id="getKeyLink" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" title="到 Google AI Studio 申請 Gemini API 金鑰（另開分頁）">申請金鑰 ↗</a>
    <span class="row"><input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上金鑰"><button type="button" id="showKey">顯示</button></span>
  </label>
  <p class="hint">金鑰只存在這台裝置的瀏覽器，不會送到 Google 以外的地方。這個做法只適合自己使用：不要把金鑰傳給別人，也不要在別人的裝置上存金鑰。</p>
  <p class="hint"><button type="button" id="copyLog">複製除錯紀錄</button> <span id="copyLogMsg"></span><br>紀錄只有時間、事件代碼與字數，不含字幕內容與金鑰。字幕出問題時複製後傳給開發者。</p>
  <div class="row">
    <button type="button" id="forgetKey">刪除金鑰</button>
    <span class="spacer"></span>
    <button type="button" id="cancelSettings">取消</button>
    <button type="button" id="saveSettings" class="primary">儲存</button>
  </div>
</dialog>
