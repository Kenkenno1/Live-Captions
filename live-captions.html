<body data-view="s0">
<header>
  <h1>英語即時字幕</h1>
  <div class="status" role="status" aria-live="polite"><span id="statusDot" class="dot" aria-hidden="true"></span><span id="statusText">尚未開始</span></div>
  <button type="button" id="enginePill" class="chip" hidden></button>
  <button type="button" id="costBtn" class="chip" title="本頁 Gemini 累計費用（估算），按一下看算法" aria-expanded="false" aria-controls="costDetail" hidden></button>
  <div class="meter" title="麥克風音量"><i id="meterBar"></i></div>
  <span class="version">v1.3.0</span>
</header>

<div id="stage">
<main id="main">
  <div id="notice" class="notice" hidden><span id="noticeText"></span><button type="button" id="noticeClose">關閉</button></div>
  <div id="costDetail" class="detail" hidden></div>
  <div id="hint" hidden><span id="hintBars" class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="hintText"></span></div>
  <div id="captions" lang="en" aria-live="polite"><p id="interim"></p></div>
</main>
<section id="launch" aria-label="開始與引擎選擇">
  <button type="button" id="startBtn" class="primary"><span class="orb" aria-hidden="true"><svg class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/></svg><svg class="ico-stop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg></span><span id="startLabel">開始辨識</span></button>
  <fieldset id="engineSeg">
    <legend>辨識引擎</legend>
    <label><input type="radio" name="engineChoice" id="engBrowser" value="browser"><span>瀏覽器・免費</span></label>
    <label><input type="radio" name="engineChoice" id="engGemini" value="gemini"><span>Gemini・付費</span></label>
  </fieldset>
  <p id="rateLine"><span id="rateText"></span><button type="button" id="rateKeyBtn" hidden>設定金鑰</button></p>
  <p id="empty" class="empty">按「開始辨識」後，講者說的英語會即時顯示在這裡。</p>
</section>
</div>
<button type="button" id="jumpBtn" hidden>↓ 最新</button>

<footer id="footer">
  <span class="spacer"></span>
  <button type="button" id="smallerBtn" aria-label="字變小">A−</button>
  <button type="button" id="biggerBtn" aria-label="字變大">A+</button>
  <button type="button" id="clearBtn">清除</button>
  <button type="button" id="settingsBtn">設定</button>
</footer>

<dialog id="settings">
  <h2>設定</h2>
  <p id="settingsMsg" class="msg" hidden></p>
  <label>辨識引擎
    <select id="engineSelect">
      <option value="gemini">Gemini（準確，需要金鑰）</option>
      <option value="browser">瀏覽器內建（免費，準確度較低）</option>
    </select>
  </label>
  <label>Gemini API 金鑰
    <a id="getKeyLink" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" title="到 Google AI Studio 申請 Gemini API 金鑰（另開分頁）">申請金鑰 ↗</a>
    <span class="row"><input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上金鑰"><button type="button" id="showKey">顯示</button></span>
  </label>
  <p class="hint">金鑰只存在這台裝置的瀏覽器，不會送到 Google 以外的地方。這個做法只適合自己使用：不要把金鑰傳給別人，也不要在別人的裝置上存金鑰。</p>
  <p class="hint"><button type="button" id="copyLog">複製除錯紀錄</button> <span id="copyLogMsg"></span><br>紀錄只有時間、事件代碼與字數，不含字幕內容與金鑰。字幕出問題時複製後傳給開發者。</p>
  <div class="row">
    <button type="button" id="forgetKey">刪除金鑰</button>
    <span class="spacer"></span>
    <button type="button" id="cancelSettings">取消</button>
    <button type="button" id="saveSettings" class="primary">儲存</button>
  </div>
</dialog>
